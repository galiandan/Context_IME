name: release-vsix
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require stable tag matching package and lock versions
        run: node scripts/release-metadata.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  build:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: artifacts/vsix
          merge-multiple: true
      - name: Validate complete release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-metadata.mjs --verify-assets
          # Refuse to overwrite an existing release. A failed draft stays private
          # for inspection; delete that draft explicitly before rerunning this job.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG" artifacts/vsix/*.vsix artifacts/vsix/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false
